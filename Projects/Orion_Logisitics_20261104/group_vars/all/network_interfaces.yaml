---
#Interface and IP configs for the network devices

site_interfaces:
    
# Routers    
    
    R-ISP:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to R-HQ1"
        ip_address: 198.51.100.1
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1
        description: "Uplink to R-HQ2"
        ip_address: 198.51.100.5
        netmask: 255.255.255.252
      - name: GigabitEthernet0/2
        description: "Uplink to R-BR1"
        ip_address: 198.51.100.9
        netmask: 255.255.255.252
      - name: GigabitEthernet0/3
        description: "Uplink to R-BR2"
        ip_address: 198.51.100.13
        netmask: 255.255.255.252
      - name: Loopback1
        description: "Loopback interface for R-ISP"
        ip_address: 1.1.1.1
        netmask: 255.255.255.255

    R-HQ1:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to R-ISP"
        ip_address: 198.51.100.2
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1
        description: "Link to R-HQ2"
        ip_address: 10.0.0.1
        netmask: 255.255.255.252
      - name: GigabitEthernet0/2
        description: "Link to SW-DIST1"
        ip_address: 10.0.0.5
        netmask: 255.255.255.252
      - name: GigabitEthernet0/3
        description: "Link to SW-DIST2"
        ip_address: 10.0.0.9
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1.10
        description: "VLAN 10 interface for MGMT"
        ip_address: 10.10.10.1
        netmask: 255.255.255.0
        vlan_id: 10
      - name: GigabitEthernet0/1.20
        description: "VLAN 20 interface for Corp"
        ip_address: 10.10.20.1
        netmask: 255.255.255.0
        vlan_id: 20
      - name: GigabitEthernet0/1.30
        description: "VLAN 30 interface for Guest"
        ip_address: 10.10.30.1
        netmask: 255.255.255.0
        vlan_id: 30
      - name: GigabitEthernet0/1.40
        description: "VLAN 40 interface for Servers"
        ip_address: 10.10.40.1
        netmask: 255.255.255.0
        vlan_id: 40
      - name: Loopback1
        description: "Loopback interface for R-HQ1"
        ip_address: 2.2.2.2
        netmask: 255.255.255.255
      
    R-HQ2:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to R-ISP"
        ip_address: 198.51.100.6
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1
        description: "Link to R-HQ1"
        ip_address: 10.0.0.2
        netmask: 255.255.255.252
      - name: GigabitEthernet0/2
        description: "Link to SW-DIST1"
        ip_address: 10.0.0.13
        netmask: 255.255.255.252
      - name: GigabitEthernet0/3
        description: "Link to SW-DIST2"
        ip_address: 10.0.0.17
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1.10
        description: "VLAN 10 interface for MGMT"
        ip_address: 10.10.10.2
        netmask: 255.255.255.0
        vlan_id: 10
      - name: GigabitEthernet0/1.20
        description: "VLAN 20 interface for Corp"
        ip_address: 10.10.20.2
        netmask: 255.255.255.0
        vlan_id: 20
      - name: GigabitEthernet0/1.30
        description: "VLAN 30 interface for Guest"
        ip_address: 10.10.30.2
        netmask: 255.255.255.0
        vlan_id: 30
      - name: GigabitEthernet0/1.40
        description: "VLAN 40 interface for Servers"
        ip_address: 10.10.40.2
        netmask: 255.255.255.0
        vlan_id: 40
      - name: Loopback1
        description: "Loopback interface for R-HQ2"
        ip_address: 3.3.3.3
        netmask: 255.255.255.255

    R-BR1:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Link to SW-BR1"
        ip_address: 10.0.1.1
        netmask: 255.255.255.252
      - name: GigabitEthernet0/0.110
        description: "VLAN 110 interface for BR1 Users"
        ip_address: 10.11.10.1
        netmask: 255.255.255.0
        vlan_id: 110
      - name: GigabitEthernet0/1
        description: "Uplink to R-ISP"
        ip_address: 198.51.100.10
        netmask: 255.255.255.252
      - name: Loopback1
        description: "Loopback interface for R-BR1"
        ip_address: 4.4.4.4
        netmask: 255.255.255.255

    R-BR2:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Link to SW-BR2"
        ip_address: 10.0.2.1
        netmask: 255.255.255.252
      - name: GigabitEthernet0/0.120
        description: "VLAN 120 interface for BR2 Users"
        ip_address: 10.12.10.1
        netmask: 255.255.255.0
        vlan_id: 120
      - name: GigabitEthernet0/1
        description: "Uplink to R-ISP"
        ip_address: 198.51.100.14
        netmask: 255.255.255.252
      - name: Loopback1
        description: "Loopback interface for R-BR1"
        ip_address: 5.5.5.5
        netmask: 255.255.255.255

  ## Switches

    SW-DIST1:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to R-HQ1"
        ip_address: 10.0.0.6
        netmask: 255.255.255.252
        routed: true
      - name: GigabitEthernet0/1
        description: "Uplink to R-HQ2"
        ip_address: 10.0.0.14
        netmask: 255.255.255.252
        routed: true
      - name: GigabitEthernet0/2
        description: "Trunk link to SW-DIST2"
        mode: trunk
        allowed_vlans: "10,20,30,40"
      - name: GigabitEthernet0/3
        description: "Trunk link to SW-ACC1"
        mode: trunk
        allowed_vlans: "10,20,30,40"
      - name: Vlan10
        description: "Users SVI"
        ip_address: "10.1.10.5"
        netmask: "255.255.255.0"
      - name: Vlan20
        description: "Voice SVI"
        ip_address: "10.1.20.5"
        netmask: "255.255.255.0"
      - name: Vlan30
        description: "Guest SVI"
        ip_address: "10.1.30.5"
        netmask: "255.255.255.0"
      - name: Vlan40
        description: "Servers SVI"
        ip_address: "10.1.40.5"
        netmask: "255.255.255.0"
      - name: Loopback1
        description: "Loopback interface for SW-DIST1"
        ip_address: 6.6.6.6
        netmask: 255.255.255.255
      
      