---
- name: Ensure VLANs are configured on switches
  cisco.ios.ios_vlans:
    config:
      - vlan_id: 10
        name: MGMT
      - vlan_id: 20
        name: Corp
      - vlan_id: 30
        name: Guest
      - vlan_id: 40
        name: Servers
      - vlan_id: 110
        name: Branch 1 User
      - vlan_id: 120
        name: Branch 2 User
  when: inventory_hostname is match("^SW-")
