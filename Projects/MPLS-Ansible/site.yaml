---
# Main entrypoint playbook for MPLS-Ansible

# Step 1: Configure Interfaces and OSPF on Core Routers
- name: Configure Interfaces in Core 
  hosts: P1,P2,P3
  gather_facts: false
  
  roles:
    - network_interface_config

- name: Configure OSPF in Core
  hosts: P1,P2,P3
  gather_facts: false
  
  roles:
    - ospf_config

# Step 2: Configure VRFs, Interfaces and OSPF on Provider Edge Routers
- name: Configure VRFs on Provider Edge Routers
  hosts: PE1,PE2,PE3,PE4
  gather_facts: false
  
  roles:
    - vrf_config

- name: Configure Interfaces on Provider Edge Routers
  hosts: PE1,PE2,PE3,PE4
  gather_facts: false
  
  roles:
    - network_interface_config

- name: Configure OSPF on Provider Edge Routers
  hosts: PE1,PE2,PE3,PE4
  gather_facts: false

  roles:
    - ospf_config

# Step 3: Configure Interfaces and OSPF on Customer Edge Routers
- name: Configure Interfaces in Customer Edge
  hosts: CE1,CE2,CE3,CE4,CE5,CE6,CE7,CE8
  gather_facts: false 

  roles:
    - network_interface_config

- name: Configure OSPF in Customer Edge
  hosts: CE1,CE2,CE3,CE4,CE5,CE6,CE7,CE8
  gather_facts: false

  roles:
    - ospf_config

# Step 4: Adjust LDP settings on Core and Provider Edge Routers
- name: Adjust LDP settings on Core and Provider Edge Routers
  hosts: P1,P2,P3,PE1,PE2,PE3,PE4
  gather_facts: false

  roles:
    - ldp_config

# Step 5: Configure MPLS on Core and Provider Edge Routers
- name: Configure MPLS on Core and Provider Edge Routers
  hosts: P1,P2,P3,PE1,PE2,PE3,PE4
  gather_facts: false
  
  roles:
    - mpls_autoconfig

# Step 6: Configure MP-BGP on Provider Edge Routers
- name: Configure MP-BGP on Provider Edge Routers
  hosts: PE1,PE2,PE3,PE4
  gather_facts: false
  
  roles:
    - mp_bgp_config