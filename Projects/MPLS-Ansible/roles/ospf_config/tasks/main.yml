---

- name: Configure OSPF routing
  cisco.ios.ios_config:
    lines: "{{ ['router-id ' ~ item.router_id] + item.networks }}"
    parents: >-
      router ospf {{ item.ospf_process_id }}{{ ' vrf ' ~ item.vrf if item.vrf | default('') | length > 0 else '' }}
  loop: "{{ ospf_configs[inventory_hostname] }}"
  when: inventory_hostname in ospf_configs