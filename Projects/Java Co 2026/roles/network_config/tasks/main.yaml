---

- name: Configure router interfaces, subinterfaces, and tunnels
  cisco.ios.ios_config:
    lines:
      - "{{ 'encapsulation dot1Q ' ~ item.vlan_id if item.vlan_id is defined else omit }}"
      - description {{ item.description }}
      - "{{ 'tunnel source ' ~ item.tunnel_source if item.tunnel_source is defined else omit }}"
      - "{{ 'tunnel destination ' ~ item.tunnel_destination if item.tunnel_destination is defined else omit }}"
      - ip address {{ item.ip_address }} {{ item.netmask }}
      - no shutdown
    parents: "interface {{ item.name }}"
  loop: "{{ site_interfaces[inventory_hostname].interfaces }}"
  when: inventory_hostname in site_interfaces

  