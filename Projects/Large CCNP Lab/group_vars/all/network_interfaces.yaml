---
#Interface and IP configs for the network devices

site_interfaces:
    
# Routers    
    
    ISP_01:
      interfaces:
      - name: GigabitEthernet0/1
        description: "Link to EDGE-01"
        ip_address: 198.51.100.1
        netmask: 255.255.255.252
      - name: Loopback1
        description: "Loopback interface for ISP_01"
        ip_address: 1.1.1.1
        netmask: 255.255.255.255

    ISP_02:
      interfaces:
      - name: GigabitEthernet0/1
        description: "Link to EDGE-02"
        ip_address: 203.0.113.1
        netmask: 255.255.255.252
      - name: Loopback1
        description: "Loopback interface for ISP_02"
        ip_address: 2.2.2.2
        netmask: 255.255.255.255

    EDGE_01:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to ISP_ROUTER"
        ip_address: 198.51.100.2
        netmask: 255.255.255.252
      - name: GigabitEthernet0/1
        description: "Trying Interface On"
        ip_address: 10.1.50.1
        netmask: 255.255.255.0
    
    HQ-Server:
      interfaces:
      - name: GigabitEthernet0/1
        description: "Connection to SW1"
        ip_address: 10.1.22.50
        netmask: 255.255.255.0
      - name: GigabitEthernet0/1.10
        description: "VLAN 10 interface for MGMT"
        ip_address: 10.1.10.4
        netmask: 255.255.255.0
        vlan_id: 10
      - name: GigabitEthernet0/1.20
        description: "VLAN 20 interface for Corp"
        ip_address: 10.1.20.4
        netmask: 255.255.255.0
        vlan_id: 20
      - name: GigabitEthernet0/1.30
        description: "VLAN 30 interface for Guest"
        ip_address: 10.1.30.4
        netmask: 255.255.255.0
        vlan_id: 30
      - name: Loopback1
        description: "Loopback interface for HQ-Server"
        ip_address: 4.4.4.4
        netmask: 255.255.255.255
      

    BRANCH_ROUTER:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to SW-1"
        ip_address: 10.1.50.2
        netmask: 255.255.255.0
      - name: GigabitEthernet0/1
        description: "Uplink to SW-2"
        ip_address: 10.1.60.1
        netmask: 255.255.255.0
      - name: GigabitEthernet0/1.10
        description: "VLAN 10 interface for MGMT"
        ip_address: 10.1.10.1
        netmask: 255.255.255.0
        vlan_id: 10
      - name: GigabitEthernet0/1.20
        description: "VLAN 20 interface for Corp"
        ip_address: 10.1.20.1
        netmask: 255.255.255.0
        vlan_id: 20
      - name: GigabitEthernet0/1.30
        description: "VLAN 30 interface for Guest"
        ip_address: 10.1.30.1
        netmask: 255.255.255.0
        vlan_id: 30
      - name: Loopback1
        description: "Loopback interface for BRANCH_ROUTER"
        ip_address: 3.3.3.3
        netmask: 255.255.255.255
      - name: Tunnel0
        description: "GRE Tunnel to Core"
        ip_address: "10.255.0.2"
        netmask: "255.255.255.252"
        tunnel_source: "GigabitEthernet0/0"
        tunnel_destination: "198.51.100.1" # Core public IP

# Switches

    SW1:
      interfaces:
      - name: GigabitEthernet1/0/24
        description: "Trunk uplink to HQ Router"
        mode: trunk
        allowed_vlans: "10,20,30"
      - name: GigabitEthernet1/0/2
        description: "Trunk port for server"
        mode: trunk
        allowed_vlans: "10,20,30"
      - name: Vlan10
        description: "MGMT SVI"
        ip_address: "10.1.10.5"
        netmask: "255.255.255.0"
      - name: Vlan20
        description: "Corp SVI"
        ip_address: "10.1.20.5"
        netmask: "255.255.255.0"
      - name: Vlan30
        description: "Guest SVI"
        ip_address: "10.1.30.5"
        netmask: "255.255.255.0"
      - name: GigabitEthernet1/0/1
        description: "Trunk to Branch Router"
        mode: trunk
        allowed_vlans: "10,20,30"

    SW2:
      interfaces:
      - name: GigabitEthernet1/0/24
        description: "Trunk uplink to Branch Router"
        mode: trunk
        allowed_vlans: "10,20,30"
      - name: GigabitEthernet1/0/2
        description: "Access port for server"
        mode: access
        access_vlan: 20
      - name: Vlan10
        description: "MGMT SVI"
        ip_address: "10.1.10.6"
        netmask: "255.255.255.0"
      - name: Vlan20
        description: "Corp SVI"
        ip_address: "10.1.20.6"
        netmask: "255.255.255.0"
      - name: Vlan30
        description: "Guest SVI"
        ip_address: "10.1.30.6"
        netmask: "255.255.255.0"
      - name: GigabitEthernet1/0/1
        description: "Management PC"
        mode: access
        access_vlan: 10
      - name: GigabitEthernet1/0/2
        description: "Staff PC"
        mode: access
        access_vlan: 20
      - name: GigabitEthernet1/0/3
        description: "Guest PC"
        mode: access
        access_vlan: 30
        