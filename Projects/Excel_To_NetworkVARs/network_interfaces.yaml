---
# Interface and IP configs for the network devices

site_interfaces:
# Routers
    P1:
      interfaces:
        - name: L0
          description: "Loopback P1"
          ip_address: 10.255.255.1
          netmask: 255.255.255.255
        - name: G0/1
          description: "to P2"
          ip_address: 10.255.0.1
          netmask: 255.255.255.252
        - name: G0/2
          description: "to P3"
          ip_address: 10.255.0.9
          netmask: 255.255.255.252
        - name: G0/3
          description: "to PE1"
          ip_address: 10.255.0.13
          netmask: 255.255.255.252
        - name: G0/4
          description: "to PE2"
          ip_address: 10.255.0.17
          netmask: 255.255.255.252
    P2:
      interfaces:
        - name: L0
          description: "Loopback P2"
          ip_address: 10.255.255.2
          netmask: 255.255.255.255
        - name: G0/1
          description: "to P1"
          ip_address: 10.255.0.2
          netmask: 255.255.255.252
        - name: G0/2
          description: "to P3"
          ip_address: 10.255.0.5
          netmask: 255.255.255.252
        - name: G0/3
          description: "to PE2"
          ip_address: 10.255.0.21
          netmask: 255.255.255.252
        - name: G0/4
          description: "to PE3"
          ip_address: 10.255.0.25
          netmask: 255.255.255.252
