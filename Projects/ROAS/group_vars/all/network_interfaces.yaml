---
#Interface and IP configs for the network devices

site_interfaces:
    
# Routers    

    R1:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Uplink to SW1"
        ip_address: 172.16.1.1
        netmask: 255.255.255.0
      - name: GigabitEthernet0/0.10
        description: "VLAN 10 interface for MGMT"
        ip_address: 172.16.10.1
        netmask: 255.255.255.0
        vlan_id: 10
      - name: GigabitEthernet0/0.20
        description: "VLAN 20 interface for Corp"
        ip_address: 172.16.20.1
        netmask: 255.255.255.0
        vlan_id: 20
      - name: GigabitEthernet0/0.30
        description: "VLAN 30 interface for Voice"
        ip_address: 172.16.30.1
        netmask: 255.255.255.0
        vlan_id: 30
      - name: GigabitEthernet0/0.40
        description: "VLAN 40 interface for Servers"
        ip_address: 172.16.40.1
        netmask: 255.255.255.0
        vlan_id: 40
      - name: Loopback1
        description: "Loopback interface for R1"
        ip_address: 1.1.1.1
        netmask: 255.255.255.255

# Swtiches

    SW-1:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Trunk link to R1"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/1
        description: "Trunk link to SW2"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/2
        description: "Trunk link to SW3"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1

    SW-2:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Trunk link to SW1"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/1
        description: "Trunk link to SW3"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/2
        description: "Access Port - Corp Vlan 20"
        mode: access
        vlan_id: 20

    SW-3:
      interfaces:
      - name: GigabitEthernet0/0
        description: "Trunk link to SW1"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/1
        description: "Trunk link to SW2"
        mode: trunk
        allowed_vlans: "1,10,20,30,40"
        native_vlan: 1
      - name: GigabitEthernet0/2
        description: "Access Port - Vlan 40"
        mode: access
        vlan_id: 40