---
# 1. Global Layer 3 Switch Activation
- name: Enable global IP routing on multilayer switches
  cisco.ios.ios_config:
    lines:
      - ip routing
  when: 
    - inventory_hostname in site_interfaces
    - site_interfaces[inventory_hostname].global_routing is defined
    - site_interfaces[inventory_hostname].global_routing

# 2. Native module handles 'no shutdown' idempotently
- name: Ensure all required interfaces are enabled
  cisco.ios.ios_config:
    lines:
      - no shutdown
    parents:
      - "interface {{ item.name }}"
  loop: "{{ site_interfaces[inventory_hostname].interfaces }}"
  when: inventory_hostname in site_interfaces

# 3. Configure Layer 2 Switch Access and Trunk Ports
- name: Configure Layer 2 switch ports (Access and Trunks)
  cisco.ios.ios_config:
    lines:
      - "{{ 'description ' ~ item.description if item.description is defined else omit }}"
      - "switchport mode {{ item.mode }}"
      - "{{ 'switchport trunk encapsulation dot1q' if item.mode == 'trunk' else omit }}"
      - "{{ 'switchport trunk allowed vlan ' ~ item.allowed_vlans if item.allowed_vlans is defined else omit }}"
      - "{{ 'switchport access vlan ' ~ item.vlan_id if item.vlan_id is defined else omit }}"
      - no shutdown
    parents: "interface {{ item.name }}"
    match: line
  loop: "{{ site_interfaces[inventory_hostname].interfaces }}"
  when: 
    - inventory_hostname in site_interfaces
    - inventory_hostname is match("^SW-")
    - item.routed is not defined or not item.routed
    - not item.name.startswith('Loopback')

# 4. Configure Layer 3 Router Subinterfaces & Routed Ports
- name: Configure Layer 3 router subinterfaces and routed ports
  cisco.ios.ios_config:
    lines:
      - "{{ 'description ' ~ item.description if item.description is defined else omit }}"
      - "{{ 'no switchport' if item.routed is defined and item.routed else omit }}"
      - "{{ 'encapsulation dot1q ' ~ item.vlan_id if item.vlan_id is defined else omit }}"
      - "{{ 'ip address ' ~ item.ip_address ~ ' ' ~ item.netmask if item.ip_address is defined and item.netmask is defined else omit }}"
      - no shutdown
    parents: "interface {{ item.name }}"
    match: line
  loop: "{{ site_interfaces[inventory_hostname].interfaces }}"
  when: 
    - inventory_hostname in site_interfaces
    - not item.name.startswith('Loopback')
    - inventory_hostname is match("^R-")
    - item.name is search("\\.") or (item.routed is defined and item.routed)

# 5. Configure Loopbacks line by line
- name: Configure router loopback interfaces
  cisco.ios.ios_config:
    lines:
      - "{{ 'description ' ~ item.description if item.description is defined else omit }}"
      - "ip address {{ item.ip_address }} {{ item.netmask }}"
    parents: "interface {{ item.name }}"
    match: line
  loop: "{{ site_interfaces[inventory_hostname].interfaces }}"
  when: 
    - inventory_hostname in site_interfaces
    - item.name.startswith('Loopback')
